apply plugin: 'fabric-loom'

base {
    archivesName = "${rootProject.mod_name}-fabric"
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "${rootProject.mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"

    implementation project(':common')

    // Базы данных мессенджера (на клиенте не используются, но мод один на клиент и сервер).
    include(implementation("com.h2database:h2:${rootProject.h2_version}") { transitive = false })
    include(implementation("org.mariadb.jdbc:mariadb-java-client:${rootProject.mariadb_version}") { transitive = false })

    // Музыка: декодер MP3 (LGPL). OGG декодирует stb_vorbis из LWJGL (уже есть в Minecraft).
    include(implementation("javazoom:jlayer:${rootProject.jlayer_version}") { transitive = false })

    testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    def props = [
            version          : project.version,
            minecraft_version: rootProject.minecraft_version,
            loader_version   : rootProject.loader_version
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand props
    }
}

// Тесты видят клиентский код (музыка: теги, разбор ответов сервисов, декодеры).
sourceSets {
    test {
        compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
}

test {
    useJUnitPlatform()
}

// Классы модуля common кладём прямо в jar мода.
jar {
    from(project(':common').sourceSets.main.output)
}

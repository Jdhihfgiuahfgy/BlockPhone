apply plugin: 'fabric-loom'

base {
    archivesName = "${rootProject.mod_name}-fabric"
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "${rootProject.mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
    // TDLight — TDLib для Java с готовыми нативными библиотеками (Telegram).
    maven { url = 'https://mvn.mchv.eu/repository/mchv/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"

    implementation project(':common')
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${rootProject.voicechat_api_version}"
    // Сам Simple Voice Chat — только для запуска из среды разработки (проверка звонков в DevShots).
    modLocalRuntime "maven.modrinth:simple-voice-chat:${rootProject.voicechat_mod_version}"

    // Базы данных мессенджера (на клиенте не используются, но мод один на клиент и сервер).
    include(implementation("com.h2database:h2:${rootProject.h2_version}") { transitive = false })
    include(implementation("org.mariadb.jdbc:mariadb-java-client:${rootProject.mariadb_version}") { transitive = false })

    // Музыка: декодер MP3 (LGPL). OGG декодирует stb_vorbis из LWJGL (уже есть в Minecraft).
    include(implementation("javazoom:jlayer:${rootProject.jlayer_version}") { transitive = false })

    // Telegram: TDLight (LGPL-3.0) + TDLib (Boost) — нативная библиотека только для Windows x64.
    include(implementation("it.tdlight:tdlight-java:${rootProject.tdlight_java_version}") { transitive = false })
    include(implementation("it.tdlight:tdlight-api:${rootProject.tdlight_api_version}") { transitive = false })
    include(implementation("it.tdlight:tdlight-natives:${rootProject.tdlight_natives_version}:windows_amd64") { transitive = false })
    include(implementation("org.reactivestreams:reactive-streams:1.0.4"))
    include(implementation("io.atlassian.util.concurrent:atlassian-util-concurrent:4.0.1") { transitive = false })
    // «Кружочки»: кодировщик H.264/MP4 на чистой Java (BSD).
    include(implementation("org.jcodec:jcodec:${rootProject.jcodec_version}") { transitive = false })

    testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    def props = [
            version          : project.version,
            minecraft_version: rootProject.minecraft_version,
            loader_version   : rootProject.loader_version
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand props
    }
}

// Тесты видят клиентский код (музыка: теги, разбор ответов сервисов, декодеры).
sourceSets {
    test {
        compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
}

test {
    useJUnitPlatform()
}

// Классы модуля common кладём прямо в jar мода.
jar {
    from(project(':common').sourceSets.main.output)
}

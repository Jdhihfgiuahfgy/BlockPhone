// Мод для Minecraft 1.21.10. Своих исходников почти нет: при сборке берутся исходники модуля fabric (под 1.21.11),
// в них заменяются имена, которые в 1.21.11 переименовали (см. portRenames), а файлы из src/ этого модуля
// подменяют одноимённые общие (там, где различия не сводятся к переименованию). Сама сборка — gradle/fabric-port.gradle.

apply from: rootProject.file('gradle/port-renames.gradle')

ext.portMinecraft = rootProject.legacy_minecraft_version
ext.portMinecraftDep = rootProject.legacy_minecraft_version
ext.portFabricApi = rootProject.legacy_fabric_version
ext.portRenames = RENAMES_1_21_10
apply from: rootProject.file('gradle/fabric-port.gradle')

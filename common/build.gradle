// Платформонезависимый код: протокол, модели, логика сервера мессенджера.
// Никаких зависимостей от Minecraft — его подключают fabric, paper и velocity.
// JDBC-драйверы (H2, MariaDB) поставляют платформы; здесь они нужны только для тестов.
dependencies {
    // Интеграция с Simple Voice Chat (группы для звонков) — только интерфейсы, сам мод ставит игрок/админ.
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${rootProject.voicechat_api_version}"
    // Свои приложения (JSON): Gson есть во всех платформах (Minecraft, Paper, Velocity, BungeeCord).
    compileOnly "com.google.code.gson:gson:${rootProject.gson_version}"
    testImplementation "com.google.code.gson:gson:${rootProject.gson_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testRuntimeOnly "com.h2database:h2:${rootProject.h2_version}"
}

test {
    useJUnitPlatform()
}

// Инструкция по своим приложениям кладётся в jar — сервер копирует её в папку apps при первом запуске.
processResources {
    from(rootProject.file('docs/CUSTOM_APPS.md')) {
        into 'blockphone/apps'
    }
    // Шаблон своего сервера комнат для авторов приложений (сервер — тот же, что relay-server/).
    from(rootProject.file('relay-server/worker.js')) {
        into 'blockphone/apps/relay-server-template'
    }
    from(rootProject.file('docs/relay-template')) {
        into 'blockphone/apps/relay-server-template'
    }
    // Сторонние компоненты и их лицензии — в корень каждого jar (fabric, paper, velocity, bungee берут ресурсы common).
    from(rootProject.file('THIRD_PARTY_NOTICES.md'))
    from(rootProject.file('licenses')) {
        into 'licenses'
    }
}

// Плагин для прокси Velocity: мессенджер, общий для всей сети серверов.
base {
    archivesName = "${rootProject.mod_name}-velocity"
}

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

configurations {
    // Библиотеки, которые кладутся внутрь jar (у Velocity нет загрузчика библиотек).
    shade
    implementation.extendsFrom shade
}

dependencies {
    compileOnly "com.velocitypowered:velocity-api:${rootProject.velocity_api_version}"
    annotationProcessor "com.velocitypowered:velocity-api:${rootProject.velocity_api_version}"
    implementation project(':common')
    shade("com.h2database:h2:${rootProject.h2_version}") { transitive = false }
    shade("org.mariadb.jdbc:mariadb-java-client:${rootProject.mariadb_version}") { transitive = false }
}

jar {
    from(project(':common').sourceSets.main.output)
    from({ configurations.shade.collect { it.isDirectory() ? it : zipTree(it) } }) {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/versions/*/module-info.class', 'module-info.class'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

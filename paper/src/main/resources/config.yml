# BlockPhone — настройки сервера

messenger:
  # Включить серверный мессенджер для игроков с модом.
  # В сети серверов (Velocity) мессенджер работает на прокси — здесь можно выключить.
  enabled: true

phone-in-hand:
  # Показывать другим игрокам телефон в руке, пока игрок им пользуется
  visible: true

social:
  # Лента: посты, лайки, комментарии, профили, паблики.
  # В сети серверов (Velocity) лента работает на прокси — здесь можно выключить.
  enabled: true
  # Фото в ленте и чатах: any — любые картинки, server — только снимки камерой BlockPhone на этом сервере,
  # none — без фото. (Проверка опирается на клиент мода: от взломанного клиента не защищает.)
  photos: server
  # Предел размера одного фото (КБ) и длинной стороны (пикселей); клиент сам уменьшает и сжимает фото.
  max-photo-kb: 600
  max-photo-side: 1280
  # Сколько пабликов может создать один игрок (модераторов это не касается).
  max-publics-per-player: 3

# Ники или UUID игроков с полными правами модератора (удаление постов и пабликов, заглушение, жалобы).
# Удобно, если нет LuckPerms. Операторы (op) — модераторы и без этого списка.
# Права: blockphone.post, blockphone.photo, blockphone.public.create (у всех);
#        blockphone.moderate.posts, .publics, .mute, .reports, blockphone.moderator — все сразу (у операторов).
moderators: []

storage:
  # h2 — встроенная база в папке плагина (ничего настраивать не нужно)
  # mysql — сервер MySQL или MariaDB (настройки ниже)
  type: h2
  table-prefix: bp_
  mysql:
    host: localhost
    port: 3306
    database: blockphone
    user: root
    password: ""

# BlockPhone — настройки сервера

messenger:
  # Включить серверный мессенджер для игроков с модом.
  # В сети серверов (Velocity) мессенджер работает на прокси — здесь можно выключить.
  enabled: true

phone-in-hand:
  # Показывать другим игрокам телефон в руке, пока игрок им пользуется
  visible: true

social:
  # Лента: посты, лайки, комментарии, профили, паблики.
  # В сети серверов (Velocity) лента работает на прокси — здесь можно выключить.
  enabled: true
  # Фото в ленте и чатах: any — любые картинки (и снимки камерой, и картинки с компьютера), server — только снимки
  # камерой BlockPhone на этом сервере, none — без фото. (Проверка опирается на клиент мода: от взломанного клиента не защищает.)
  photos: any
  # Предел размера одного фото (КБ) и длинной стороны (пикселей); клиент сам уменьшает и сжимает фото.
  max-photo-kb: 600
  max-photo-side: 1280
  # Сколько пабликов может создать один игрок (модераторов это не касается).
  max-publics-per-player: 3

voice:
  # Голосовые сообщения в мессенджере (запись с микрофона, работают без других модов).
  messages: true
  max-seconds: 60
  # Звонки в чатах. Нужен плагин Simple Voice Chat на сервере и мод у игроков.
  calls: true
  # normal — в звонке слышно и тех, кто рядом; isolated — только участников звонка.
  call-group-type: normal

# Ники или UUID игроков с полными правами модератора (удаление постов и пабликов, заглушение, жалобы).
# Удобно, если нет LuckPerms. Операторы (op) — модераторы и без этого списка.
# Права: blockphone.post, blockphone.photo, blockphone.public.create, blockphone.voice, blockphone.call (у всех);
#        blockphone.moderate.posts, .publics, .mute, .reports, blockphone.moderator — все сразу (у операторов).
moderators: []

# Ограничения загружаемых файлов. Размер фото — social.max-photo-kb / max-photo-side, длина голосовых — voice.max-seconds.
uploads:
  stickers:
    # Стикеры в мессенджере (свои наборы из фото галереи). Право: blockphone.stickers (у всех).
    enabled: true
    # Предел файла стикера, КБ, и стороны, пикселей (телефон уменьшает сам).
    max-kb: 128
    max-side: 320
    # Своих наборов на игрока и стикеров в наборе.
    max-packs: 10
    max-per-pack: 30
  quota:
    # Сколько всего МБ может занимать всё, что загрузил игрок (фото, стикеры, голосовые). 0 — без ограничения.
    per-player-mb: 50
    # Сколько загрузок в сутки. 0 — без ограничения.
    uploads-per-day: 300

# Клиентские приложения игроков (игрок ставит их себе в папку игры blockphone/apps).
# Серверные части приложений — в папке plugins/BlockPhone/apps (см. CUSTOM_APPS.md там же).
apps:
  # blacklist — работают все приложения, кроме списка blacklist;
  # whitelist — только приложения из списка whitelist; none — никакие.
  mode: blacklist
  # Записи: uid приложения (uid:bp... — уникален, виден в «Магазине» и «Настройки → Свои приложения», рекомендуется),
  # id приложения (bank или id:bank — у разных приложений может совпадать) или хэш app.json (sha256:... — одна версия).
  blacklist: []
  whitelist: []

# Автомодерация текста: сообщения, названия групп, посты, комментарии, «о себе», паблики.
# Игроки с правом blockphone.filter.bypass (по умолчанию — операторы) не проверяются, если bypass-for-moderators: true.
filter:
  enabled: true
  bypass-for-moderators: true
  # Писать нарушения в лог сервера.
  log: true
  apply-to:
    messages: true
    group-names: true
    posts: true
    comments: true
    profiles: true
    publics: true
  words:
    # «слово» — целое слово (или фраза); «слово*» — начинается так; «*слово» — заканчивается так; «*слово*» — где угодно;
    # «regex:выражение» — регулярное выражение. Регистр и обходы не важны: похожие латинские/русские буквы, цифры вместо букв,
    # повторы букв («плоооохо»), буквы через точки или пробелы («п.л.о.х.о»).
    blacklist: []
    # Слова-исключения: никогда не нарушение (например, «class», если в чёрном списке «*ass*»).
    whitelist: []
    # censor — заменить звёздочками; block — не отправлять (игрок увидит причину).
    action: censor
  links:
    # allow — разрешены все ссылки, кроме запрещённых списками; block — запрещены все, кроме разрешённых.
    mode: allow
    # Домены (подходят и поддомены); можно с началом пути: youtube.com/watch
    domain-whitelist: []
    domain-blacklist: []
    # Форматы: url (с «://»), scheme:https / scheme:http / scheme:ftp …, www, domain (просто site.ru), ip, email,
    # invite (приглашения Discord/Telegram/WhatsApp/VK), obfuscated (site[.]ru, site (dot) ru, site точка ru) и свои (ниже).
    # Порядок: белый список доменов → чёрный список доменов → чёрный список форматов → белый список форматов → mode.
    format-whitelist: []
    format-blacklist: [ip, obfuscated]
    # Свои форматы: имя: регулярное выражение. Имя можно указать в списках форматов.
    custom-formats: {}
    # censor — заменить ссылку звёздочками; block — не отправлять.
    action: block
  # Столько нарушений за window-minutes минут → игрок не может писать mute-minutes минут (0 — выключено).
  auto-mute:
    violations: 5
    window-minutes: 10
    mute-minutes: 15

storage:
  # h2 — встроенная база в папке плагина (ничего настраивать не нужно)
  # mysql — сервер MySQL или MariaDB (настройки ниже)
  type: h2
  table-prefix: bp_
  mysql:
    host: localhost
    port: 3306
    database: blockphone
    user: root
    password: ""

name: BlockPhone
version: '${version}'
main: dev.blockphone.paper.BlockPhonePaper
api-version: '1.21.10'
# Simple Voice Chat (звонки) — если установлен, грузится раньше.
softdepend: [voicechat, PlaceholderAPI]
description: Server side of the BlockPhone mod (messenger, posts, moderation)
# Драйверы баз данных — Paper скачает их из Maven Central при первом запуске.
libraries:
  - com.h2database:h2:${h2_version}
  - org.mariadb.jdbc:mariadb-java-client:${mariadb_version}
commands:
  blockphone:
    description: BlockPhone admin commands (reload)
    usage: /<command> reload
    aliases: [bphone]

plugins {
    id 'fabric-loom' version '1.19-SNAPSHOT' apply false
    // Minecraft 26.1+ выходит без обфускации: для таких версий — этот id того же Loom (модули fabric-26.*).
    id 'net.fabricmc.fabric-loom' version '1.19-SNAPSHOT' apply false
    id 'xyz.jpenilla.run-paper' version '3.1.0' apply false
}

subprojects {
    apply plugin: 'java'

    group = rootProject.maven_group
    version = rootProject.mod_version

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    repositories {
        mavenCentral()
        // API Simple Voice Chat (звонки).
        maven { url = 'https://maven.maxhenkel.de/repository/public' }
    }
}

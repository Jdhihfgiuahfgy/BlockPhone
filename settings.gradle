pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }
}

plugins {
    // Автоматически скачивает нужные JDK (Loom требует Java 25 для самой сборки).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'BlockPhone'

include 'common', 'fabric', 'paper', 'velocity', 'bungee'
